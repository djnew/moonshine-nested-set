name: CI

"on":
    pull_request:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    php:
        name: PHP 8.4 / Laravel 13
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: json, pdo_sqlite, sqlite3
                  coverage: none
                  tools: composer:v2

            - name: Validate composer.json
              run: composer validate --no-check-publish --no-check-lock

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      composer-${{ runner.os }}-php84-

            - name: Install PHP dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: PHP syntax check
              run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: PHPUnit
              run: vendor/bin/phpunit --colors=always

            - name: PHP CS Fixer dry run
              run: composer format:check

    assets:
        name: Node 22 assets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22.12.0"
                  cache: npm

            - name: Install Node dependencies
              run: npm ci

            - name: Build assets
              run: npm run build

            - name: JavaScript tests
              run: npm run test:js

            - name: Prettier check
              run: npm run prettier:check

            - name: Ensure committed assets are up to date
              run: git diff --exit-code -- public/manifest.json public/assets
